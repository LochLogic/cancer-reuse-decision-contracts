name: replay
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core checks (standard library only)
        run: python replay.py
      - name: Install optional verification tools
        run: pip install -r requirements-verify.txt
      - name: Fetch TCGA-CDR table (checksum verified)
        run: python cdr/fetch_cdr.py
      - name: Full replay
        run: python replay.py --all
